<svg viewBox="0 0 680 600" width="100%" role="img"
     aria-label="파티션 모드: plan.json을 여러 유닛으로 나눠 각각 한 좌석이 동시 처리하고 결과를 merged.md와 summary.json으로 합치는 흐름"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- plan.json (Gray): 상단 -->
  <rect x="40" y="20" width="600" height="70" rx="12" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="340" y="44" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="bold" fill="#1f2937">plan.json (분할 계획 파일)</text>
  <text x="340" y="70" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1f2937">units 배열: 각 항목에 작업 범위(scope)와 프롬프트가 들어 있습니다</text>

  <!-- 분기 -->
  <line x1="340" y1="90" x2="340" y2="114" stroke="#4b5563" stroke-width="2"/>
  <line x1="115" y1="114" x2="565" y2="114" stroke="#4b5563" stroke-width="2"/>
  <line x1="115" y1="114" x2="115" y2="134" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="340" y1="114" x2="340" y2="134" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="565" y1="114" x2="565" y2="134" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>

  <!-- 유닛 + 좌석 (Blue) 3개 -->
  <rect x="20" y="140" width="190" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="166" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="bold" fill="#1e40af">unit-01</text>
  <text x="115" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">범위: src/auth/**</text>
  <text x="115" y="212" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">좌석 1개 · 동시 실행</text>
  <text x="115" y="234" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">외부 프로바이더 모델 1석</text>

  <rect x="245" y="140" width="190" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="166" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="bold" fill="#1e40af">unit-02</text>
  <text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">범위: src/api/**</text>
  <text x="340" y="212" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">좌석 1개 · 동시 실행</text>
  <text x="340" y="234" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">외부 프로바이더 모델 1석</text>

  <rect x="470" y="140" width="190" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="565" y="166" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" font-weight="bold" fill="#1e40af">unit-03</text>
  <text x="565" y="190" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">범위: docs/**</text>
  <text x="565" y="212" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">좌석 1개 · 동시 실행</text>
  <text x="565" y="234" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1e40af">외부 프로바이더 모델 1석</text>

  <!-- 유닛 → 병합 -->
  <line x1="115" y1="250" x2="115" y2="290" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="340" y1="250" x2="340" y2="290" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="565" y1="250" x2="565" y2="290" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>

  <!-- 병합 (Amber) -->
  <rect x="140" y="300" width="400" height="80" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="bold" fill="#92400e">병합 (merge)</text>
  <text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#92400e">각 좌석의 결과를 합쳐 merged.md 생성</text>
  <text x="340" y="368" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#92400e">summary.json에 분할 매니페스트 기록</text>

  <!-- 병합 → 산출물 -->
  <line x1="260" y1="380" x2="180" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>
  <line x1="420" y1="380" x2="500" y2="412" stroke="#4b5563" stroke-width="2" marker-end="url(#ahp)"/>

  <!-- 산출물 (Gray) -->
  <rect x="40" y="420" width="280" height="56" rx="10" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="180" y="448" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" fill="#1f2937">merged.md · 최종 결과물</text>
  <rect x="360" y="420" width="280" height="56" rx="10" fill="#f9fafb" stroke="#4b5563" stroke-width="2"/>
  <text x="500" y="448" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="12" fill="#1f2937">summary.json · 매니페스트 + 상태</text>

  <!-- 충돌 안내 칩 (Amber, 점선) -->
  <rect x="20" y="500" width="640" height="36" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="340" y="518" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#92400e">범위가 겹치면 충돌을 이름으로 보고하고 실행을 중단합니다. 조용한 덮어쓰기는 없습니다.</text>

  <!-- 타임아웃 칩 (Gray) -->
  <rect x="20" y="548" width="640" height="36" rx="18" fill="#f9fafb" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="340" y="566" text-anchor="middle" dominant-baseline="central" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="11" fill="#1f2937">타임아웃 자동 계산: 300 + 120 x 유닛 수(초), 최대 3600초로 제한됩니다.</text>
</svg>
