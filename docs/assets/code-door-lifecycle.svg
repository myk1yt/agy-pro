<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" width="100%" role="img" aria-label="agy pro code lifecycle: ask, plan, scope, write, verify, diff, rollback">
<title>The agy pro code pipeline</title>
